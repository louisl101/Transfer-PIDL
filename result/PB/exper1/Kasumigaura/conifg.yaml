location:
   name: Kasumigaura # name of the lake
   latitude: 36.03                               # latitude [degrees North; min=-90.0; max=90.0]
   longitude: 140.40                            # longitude [degrees East; min=-360.0; max=360.0]
   elevation: 0.2                                # elevation of lake surface above sea level [m]
   depth: 7.0                                  # maximum water depth [m; min=0.0]
   hypsograph: bathymetry_standard.csv         # hypsograph [csv file]
   init_depth: 7.0                             # initial height of lake surface relative to the bottom [m]
time:
   start: 2007-01-01 00:00:00 # start date and time [yyyy-mm-dd HH:MM:SS]
   stop: 2018-12-31 00:00:00 # stop date and time [yyyy-mm-dd HH:MM:SS]
   time_step: 3600.0                            # time step for integration [s; min=0.0]
config_files:
   GOTM: GOTM/gotm.yaml                         # GOTM config file [yaml file]
   GLM: GLM/glm3.nml                            # GLM config file [nml file]
   Simstrat: Simstrat/simstrat.par              # Simstrat config file [json-format file]
   FLake: FLake/flake.nml                       # FLake config file [nml file]
   MyLake: MyLake/mylake.Rdata                  # MyLake config file [Rdata file]
observations:
   temperature:
      file: wtemp_profile_standard.csv         # file with observed water temperature profiles, with column headers according to LakeEnsemblR vocabulary [csv file; if none use NULL or leave empty]
   ice_height:
      file: NULL                                            # file with observed ice height, with column headers according to LakeEnsemblR vocabulary [csv file; if none use NULL or leave empty]
   water_level:
      file: NULL                                            # file with observed water level in meter above bottom of the lake
input:
   init_temp_profile:
      file: initial_standard.csv         # initial temperature profile [csv file; if none use NULL or leave empty; if empty/NULL, the observations file will be used]
   meteo:
      file: meteo_standard.csv     # file with meteorological forcing data, with column headers according to LakeEnsemblR vocabulary [csv file]
   light:
      Kw:                                  # light extinction coefficient [m-1, or csv file]
         all: 0.67
   ice:
      use: false                                 # turn on ice models? [true/false]
inflows:
   use: false                                    # use in- and outflows? [true/false]
   file: inflow_standard.csv       # file with inflow data, with column headers according to LakeEnsemblR vocabulary [csv file; must be provided if inflows -> use is true]
   number_inflows: 2                            # number of inflows in the inflow file
   fix_wlvl: true                              # Sets the water level in GOTM to a constant value. Reproduces LakeEnsemblR v1.0.0 behaviour.
outflows:
   use: false                                    # use outflows? [true/false]
   file: outflow_standard.csv      # file with outflow data, with column headers according to LakeEnsemblR vocabulary [csv file; must be provided if outflows -> use is true]
   number_outflows: 1                           # number of outflows in the outflow file
   outflow_lvl: -1                              # height of the outflow above the ground. If the outflow is a surface outflow use "-1". If there are more than one outflow in the outflow file, this must be a list with one value per outflow
output:
   file: glm_output                        # name of output file, excluding extension
   format: netcdf                               # format [text/netcdf]
   depths: 0.2                                  # depths to extract output [m]
   compression: 6                               # set to an integer between 1 (least compression) and 9 (most compression), this enables compression for the variable as it is written to the file
   max_members: 25                              # maximum number of members of the same model that can be added to the netcdf
   time_unit: hour                              # time unit [second, hour, day]
   time_step: 24                                # number of time units between output [min=1]
   time_method: mean                            # treatment of time dimension [point=instantaneous, mean, integrated; only used in GOTM]
   variables:
      - temp

model_parameters:
   GLM:                                         # GLM specific parameters
      # config params
      bsn_len: 29000                             # length of the lake basin, at crest height [m]
      bsn_wid: 16000                              # width of the lake basin, at crest height [m]
      timezone: 9                                # timezone
      # tuning params
      Kw: 0.49051 
      coef_mix_hyp: 0.65046 
      coef_wind_stir: 0.73615 
      sw_factor: 0.96924 
      lw_factor: 1.0322 
      wind_factor: 1.3959 
calibration:                                    # calibration section
   GLM:                                         # GLM specific parameters
      mixing/coef_mix_hyp:
         lower: 0.1                             # lower bound for parameter
         upper: 1                               # upper bound for parameter
         initial: 0.5                             # initial value for parameter
         log: false                             # log transform scaling factor
      mixing/coef_wind_stir:
         lower: 0.1                             # lower bound for parameter
         upper: 1                               # upper bound for parameter
         initial: 0.5                             # initial value for parameter
         log: false                             # log transform scaling factor
      light/Kw:
         lower: 0.1                             # lower bound for parameter
         upper: 1.0                             # upper bound for parameter
         initial: 0.5                          # initial value for parameter
         log: false                             # log transform scaling factor
      meteorology/wind_factor:
         lower: 0.5                             # lower bound for parameter
         upper: 1.5                               # upper bound for parameter
         initial: 1                             # initial value for parameter
         log: false
      meteorology/sw_factor:
         lower: 0.5                             # lower bound for parameter
         upper: 1.5                               # upper bound for parameter
         initial: 1                             # initial value for parameter
         log: false
      meteorology/lw_factor:
         lower: 0.5                             # lower bound for parameter
         upper: 1.5                               # upper bound for parameter
         initial: 1                             # initial value for parameter
         log: false

